<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>페이지 이동 중</title>
    <script>
        (function () {
            var section = window.location.pathname.replace(/^\/+|\/+$/g, "");
            var sections = ["about", "skills", "portfolio", "contact"];
            var target = sections.indexOf(section) >= 0 ? "/#" + section : "/";

            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>포트폴리오 페이지로 이동 중입니다.</p>
    <noscript><a href="/">홈으로 이동</a></noscript>
</body>
</html>
